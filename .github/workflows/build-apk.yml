name: Build Tang Pesantren APK

on:
  workflow_dispatch:
  push:
    branches:
      - gabung-spp-bendahara
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout combined app
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Sign APK for installation
        run: |
          set -e
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$UNSIGNED"
          keytool -genkeypair -v \
            -keystore tang-pesantren-build.jks \
            -alias tangpesantren \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Tang Pesantren, OU=PPFHA, O=PPFHA, L=Indonesia, ST=Indonesia, C=ID"
          "$BUILD_TOOLS/zipalign" -f 4 "$UNSIGNED" app/build/outputs/apk/release/aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks tang-pesantren-build.jks \
            --ks-key-alias tangpesantren \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "app/build/outputs/apk/release/Tang-Pesantren-Gabungan.apk" \
            app/build/outputs/apk/release/aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose "app/build/outputs/apk/release/Tang-Pesantren-Gabungan.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tang-Pesantren-Gabungan-APK
          path: app/build/outputs/apk/release/Tang-Pesantren-Gabungan.apk
          if-no-files-found: error
          retention-days: 30
