name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/platforms" || true
          ls -la "$ANDROID_HOME/build-tools" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build unsigned APK
        run: gradle assembleRelease --no-daemon

      - name: Sign APK
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -n 1)
          echo "Using build tools: $BUILD_TOOLS"

          keytool -genkeypair -v             -keystore keuangan-pesantren-release.jks             -alias keuangan             -keyalg RSA             -keysize 2048             -validity 10000             -storepass android             -keypass android             -dname "CN=Keuangan Pesantren, OU=PPFHA, O=PPFHA, L=Indonesia, ST=Indonesia, C=ID"

          "$BUILD_TOOLS/zipalign" -f 4             app/build/outputs/apk/release/app-release-unsigned.apk             app/build/outputs/apk/release/keuangan-pesantren-aligned.apk

          "$BUILD_TOOLS/apksigner" sign             --ks keuangan-pesantren-release.jks             --ks-key-alias keuangan             --ks-pass pass:android             --key-pass pass:android             --out app/build/outputs/apk/release/Keuangan-Pesantren.apk             app/build/outputs/apk/release/keuangan-pesantren-aligned.apk

          "$BUILD_TOOLS/apksigner" verify             --verbose             app/build/outputs/apk/release/Keuangan-Pesantren.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Keuangan-Pesantren-APK
          path: app/build/outputs/apk/release/Keuangan-Pesantren.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.0"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG"             --title "Bendahara v1.0.0"             --notes "APK Bendahara / Keuangan Pesantren. Build dengan penyimpanan PDF langsung ke Download/Bendahara."
          gh release upload "$TAG" app/build/outputs/apk/release/Keuangan-Pesantren.apk --clobber

      - name: Publish APK to GitHub Pages
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/release/Keuangan-Pesantren.apk downloads/Keuangan-Pesantren.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/Keuangan-Pesantren.apk
          if git diff --cached --quiet; then
            echo "APK Pages copy unchanged"
          else
            git commit -m "Publish APK for direct download [skip ci]"
            git push
          fi
